name: 고용노동부 안전공고 자동 게시

on:
  schedule:
    # 매일 오전 9시 KST (UTC 00:00) 실행
    - cron: "0 0 * * *"
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write   # state/posted.json 커밋 위해 필요

jobs:
  crawl-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 파이썬 셋업
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 크롤링 & 게시
        env:
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
          CAFE_ID: "31767633"
          MENU_ID: "13"
        run: python main.py

      - name: 💾 상태 파일 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update posted state [skip ci]"
            git push
          else
            echo "변경사항 없음"
          end
